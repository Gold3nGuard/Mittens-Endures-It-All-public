name: Ren'Py Lint
on: [push]
jobs:
  lint:
    name: Ren'Py Lint Check
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Download Ren'Py SDK
        run: |
          wget -q https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2
          tar -xjf renpy-8.5.3-sdk.tar.bz2

      - name: Lint VN project
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
          TERM: xterm
        run: |
          ./renpy-8.5.3-sdk/renpy.sh "$GITHUB_WORKSPACE" lint --error-code